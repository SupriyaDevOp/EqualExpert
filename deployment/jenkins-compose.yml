services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins-local
    user: root                          # root so Docker socket and kubeconfig are accessible
    ports:
      - "8081:8080"                     # Jenkins UI  → http://localhost:8081
      - "50000:50000"                   # Agent JNLP port
    volumes:
      - jenkins_home:/var/jenkins_home  # persist Jenkins data across restarts
      - /var/run/docker.sock:/var/run/docker.sock   # share Docker Desktop daemon
      - ${USERPROFILE}/.kube:/root/.kube:ro          # share docker-desktop kubeconfig
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - KUBECONFIG=/root/.kube/config
    restart: unless-stopped

volumes:
  jenkins_home:
