apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment
  labels:
    app: my-app
spec:
  replicas: 4
  selector:
    matchLabels:
      name: my-pod
  template:
    metadata:
      name: my-pod
    spec:
      containers:
        - name: equalexpert
          image: equalexpert:latest
          ports:
            - containerPort: 8080
