apiVersion: apps/v1
kind: Deployment
metadata:
  name: equalexpert-api
  namespace: equalexpert
  labels:
    app: equalexpert-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: equalexpert-api
  template:
    metadata:
      labels:
        app: equalexpert-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: equalexpert-api
          image: equalexpert:latest
          imagePullPolicy: IfNotPresent        # use local image built by Docker Desktop
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
